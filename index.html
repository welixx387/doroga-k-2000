<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Шахматный план на 360 дней до 2000 рапид: каждый день до часа — задачи, партии, разборы, серия, рейтинг и награды.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231D5843'/%3E%3Ctext x='32' y='47' font-size='42' text-anchor='middle' fill='white'%3E%E2%99%98%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Дорога к 2000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: a tournament table. Felt-green ground, brass for progress, flag-red only for what needs attention.
   A two-column desk on wide screens (today's work + side stats), one column on phones. */
:root{
  --bg:#ECF1ED; --surface:#FFFFFF; --surface-2:#E2EAE4; --ink:#13231D; --muted:#53655D; --line:#CCD8D0;
  --felt:#1D5843; --felt-ink:#FFFFFF; --felt-soft:#D5E6DC;
  --brass:#8A661C; --brass-soft:#F2E8CC;
  --flag:#B43F2B; --flag-soft:#F7DED7;
  --sq-a:#DCE5DF; --sq-b:#C9D6CD; --sq-done:#2E7A55; --sq-done-2:#256848; --sq-min:#C39A3F; --sq-part:#A9CDB8;
  --scrim:rgba(11,26,21,.45);
  --shadow:0 1px 2px rgba(19,35,29,.06), 0 8px 24px rgba(19,35,29,.06);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --f-glyph:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans","Apple Symbols",serif;
  --r:14px; --r-s:9px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1A15; --surface:#12261E; --surface-2:#183126; --ink:#E3ECE6; --muted:#90A499; --line:#244136;
    --felt:#3E9A75; --felt-ink:#04110C; --felt-soft:#173A2D;
    --brass:#D6B05C; --brass-soft:#352C15;
    --flag:#E66B53; --flag-soft:#3A1E17;
    --sq-a:#183126; --sq-b:#1F3B2F; --sq-done:#3E9A75; --sq-done-2:#358866; --sq-min:#B48E3C; --sq-part:#285C47;
    --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1A15; --surface:#12261E; --surface-2:#183126; --ink:#E3ECE6; --muted:#90A499; --line:#244136;
  --felt:#3E9A75; --felt-ink:#04110C; --felt-soft:#173A2D;
  --brass:#D6B05C; --brass-soft:#352C15;
  --flag:#E66B53; --flag-soft:#3A1E17;
  --sq-a:#183126; --sq-b:#1F3B2F; --sq-done:#3E9A75; --sq-done-2:#358866; --sq-min:#B48E3C; --sq-part:#285C47;
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.glyph{font-family:var(--f-glyph);font-style:normal;line-height:1}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}

.app{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand .mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--felt);color:var(--felt-ink);font-size:21px}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%;padding:4px;background:var(--surface-2);border-radius:12px;scrollbar-width:none}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:9px;font:500 14px var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .count{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--flag);color:var(--surface);font:700 11px/18px var(--f-mono);text-align:center}

button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13.5px var(--f-body);text-decoration:none;cursor:pointer;line-height:1.25}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--felt);color:var(--felt-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--flag);color:var(--flag);background:transparent}
.btn.warn.armed{background:var(--flag);color:var(--surface)}
.btn.big{padding:12px 18px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn .ext{font-size:11px;opacity:.7}
:is(.btn,.tab,.check,.sq,.seg-o input,input,select,textarea,a):focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* layout */
.desk{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start;margin-top:8px}
.side{display:grid;gap:14px}
@media (max-width:920px){.desk{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}

/* banner */
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin-top:10px;border-radius:var(--r);background:var(--felt);color:var(--felt-ink)}
.banner p{max-width:62ch}
.banner b{font-family:var(--f-display);font-weight:500;font-size:15px;display:block;margin-bottom:2px}
.banner .btn{background:var(--felt-ink);color:var(--felt);border-color:transparent}

/* hero */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:end;padding-block:24px 18px}
.daynum-wrap{display:grid;justify-items:start}
.daynum{font-family:var(--f-display);font-weight:700;font-size:clamp(60px,10vw,108px);line-height:.88;letter-spacing:-.05em;color:var(--felt)}
.daynum-wrap .of{font-size:13px;color:var(--muted);margin-top:6px}
.hero-meta{display:grid;gap:8px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:500;color:var(--ink)}
.chip.stage{background:var(--felt-soft);color:var(--ink)}
.chip.exam{background:var(--brass-soft)}
.chip .glyph{font-size:15px}
.hero h1{font-family:var(--f-display);font-weight:500;font-size:clamp(24px,3.4vw,36px);letter-spacing:-.02em;line-height:1.1}
.hero-sub{font-size:13px;color:var(--muted)}
.daynav{display:flex;gap:6px}
.daynav .btn{padding:8px 11px}
@media (max-width:640px){
  .hero{grid-template-columns:auto minmax(0,1fr);gap:14px 18px}
  .daynav{grid-column:1 / -1}
}
.dayprog{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.dayprog span{display:block;height:100%;background:var(--felt);border-radius:6px;transition:width .3s ease}

.notice{margin-top:12px;padding:10px 14px;border-radius:var(--r-s);background:var(--surface-2);font-size:13.5px;color:var(--muted)}

.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:16px}
@media (max-width:640px){.rules{grid-template-columns:1fr}}
.rule{padding:12px 14px;border-radius:var(--r-s);background:var(--brass-soft)}
.rule.theme{background:var(--felt-soft)}
.rule p{margin-top:4px;font-size:14px}

/* tasks */
.tasks{display:grid;gap:10px}
.task{display:grid;grid-template-columns:32px minmax(0,1fr);gap:14px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:background .2s ease,border-color .2s ease}
.task.done{background:var(--surface-2);border-color:transparent}
.task.done .task-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line);text-decoration-thickness:1.5px}
.check{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0;color:transparent;transition:background .15s ease,border-color .15s ease,transform .15s ease}
.check:hover{border-color:var(--felt)}
.check[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
.check[aria-pressed="true"].min{background:var(--sq-min);border-color:var(--sq-min)}
.check:active{transform:scale(.92)}
.check[disabled]{cursor:not-allowed;opacity:.45}
.check svg{width:16px;height:16px}
.task-head{display:flex;justify-content:space-between;gap:4px 12px;align-items:baseline;flex-wrap:wrap}
.kind{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.kind.k-game,.kind.k-test{color:var(--felt)}
.kind.k-an{color:var(--brass)}
.task-title{font-weight:600;font-size:16px;line-height:1.35}
.mins{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.task-x{color:var(--muted);margin-top:4px;max-width:68ch;font-size:14.5px}
.task-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.inline-in{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.inline-in input{width:90px}

.minimum{display:grid;grid-template-columns:32px minmax(0,1fr);gap:14px;padding:14px 16px;border:1.5px dashed var(--line);border-radius:var(--r);margin-top:10px}
.minimum p{font-size:14px;color:var(--muted)}
.minimum b{color:var(--ink)}

/* side cards */
.rnow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rnow .big{font-family:var(--f-display);font-weight:700;font-size:40px;letter-spacing:-.03em;line-height:1}
.rnow .to{color:var(--muted);font-family:var(--f-mono);font-size:14px}
.rbar{position:relative;height:10px;border-radius:10px;background:var(--surface-2);margin:14px 0 8px}
.rbar span{position:absolute;left:0;top:0;bottom:0;border-radius:10px;background:var(--brass)}
.rbar i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.small{font-size:13px;color:var(--muted)}
.stat-row{display:flex;align-items:baseline;gap:8px}
.stat-row .big{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:-.03em;line-height:1}
.strip{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));margin-top:12px;border-radius:6px;overflow:hidden}
.strip i{aspect-ratio:1;max-width:100%;background:var(--sq-a)}
.strip i:nth-child(even){background:var(--sq-b)}
.strip i.done{background:var(--sq-done)} .strip i.done:nth-child(even){background:var(--sq-done-2)}
.strip i.min{background:var(--sq-min)}
.strip i.part{background:var(--sq-part)}
.xpbar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden;margin:10px 0 6px}
.xpbar span{display:block;height:100%;background:var(--felt)}
.pending{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pending .n{font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--flag)}
.pending.zero .n{color:var(--felt)}
.mini-ach{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.mini-ach span{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;background:var(--surface-2);font-size:12.5px;font-weight:500}

/* plan board */
.plan-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;padding-block:24px 16px}
.plan-head h1{font-family:var(--f-display);font-weight:500;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.02em}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:980px){.stages{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stage-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;margin-bottom:6px}
.stage-h .glyph{font-size:38px;color:var(--felt)}
.stage-h h2{font-family:var(--f-display);font-weight:500;font-size:18px;letter-spacing:-.01em}
.stage-h .pct{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--brass)}
.stage .goal{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.wk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:3px}
.wk-l{display:flex;gap:8px;align-items:baseline;min-width:0;font-size:13.5px}
.wk-l .mono{color:var(--muted);font-size:11.5px;flex:none;width:22px}
.wk-l span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk.exam .wk-l{font-weight:600}
.sqs{display:grid;grid-template-columns:repeat(7,26px);border-radius:4px;overflow:hidden}
.sq{width:26px;height:26px;border:0;padding:0;cursor:pointer;background:var(--sq-a);position:relative}
.sq.b{background:var(--sq-b)}
.sq.done{background:var(--sq-done)} .sq.done.b{background:var(--sq-done-2)}
.sq.min{background:var(--sq-min)}
.sq.part{background:var(--sq-part)}
.sq.miss{background:var(--flag-soft)}
.sq.today{box-shadow:inset 0 0 0 3px var(--brass)}
.sq.blank{visibility:hidden;cursor:default}
@media (max-width:420px){.sqs{grid-template-columns:repeat(7,22px)}.sq{width:22px;height:22px}}

/* games */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-block:4px 16px}
@media (max-width:640px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum{padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sum .v{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.chart-wrap{overflow-x:auto}
.chart{display:block;width:100%;min-width:480px;height:auto}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .sep{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.chart .ax{fill:var(--muted);font:11px var(--f-mono)}
.chart .stl{fill:var(--muted);font:600 11px var(--f-body);letter-spacing:.06em}
.chart .target{stroke:var(--brass);stroke-width:2;stroke-dasharray:6 5;fill:none}
.chart .line{stroke:var(--felt);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--felt);opacity:.12}
.chart .dot{fill:var(--felt);stroke:var(--surface);stroke-width:2}
.chart .now{stroke:var(--ink);stroke-width:1;opacity:.35}
.chart .lbl{fill:var(--ink);font:700 12px var(--f-mono)}
.chart .tlbl{fill:var(--brass);font:600 11px var(--f-body)}
.games-tools{display:flex;flex-wrap:wrap;gap:8px;margin-block:16px 10px}
.glist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.game{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;padding:14px 16px;border-top:1px solid var(--line);align-items:start}
.game:first-child{border-top:0}
.res{display:inline-grid;place-items:center;min-width:86px;padding:4px 8px;border-radius:8px;font-size:12.5px;font-weight:600}
.res.W{background:var(--felt-soft);color:var(--felt)}
.res.D{background:var(--brass-soft);color:var(--brass)}
.res.L{background:var(--flag-soft);color:var(--flag)}
.game-main{min-width:0;display:grid;gap:3px}
.game-line{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13.5px;color:var(--muted);align-items:center}
.game-line b{color:var(--ink);font-weight:600}
.game-err{font-size:14px;overflow-wrap:anywhere}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.tag.flag{background:var(--flag-soft);color:var(--flag)}
.tag.ok{background:var(--felt-soft);color:var(--felt)}
.game-act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
@media (max-width:640px){.game{grid-template-columns:minmax(0,1fr)}.game-act{flex-direction:row;flex-wrap:wrap;align-items:center}}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:500;font-size:16px;margin-bottom:4px}
.ccline{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;margin-bottom:10px;border-radius:var(--r-s);background:var(--surface-2);font-size:13.5px}
.ccline span{min-width:0;overflow-wrap:anywhere}
.ccline.err span{color:var(--flag)}

/* awards */
.ranks{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.rank{padding:6px 10px;border-radius:8px;background:var(--surface-2);font-size:12.5px;color:var(--muted)}
.rank.on{background:var(--felt);color:var(--felt-ink)}
.rank.cur{box-shadow:inset 0 0 0 2px var(--brass)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:16px}
.ach{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ach .glyph{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--brass-soft);color:var(--brass);font-size:26px}
.ach b{display:block;font-size:14.5px}
.ach span{font-size:13px;color:var(--muted)}
.ach.locked{background:transparent;border-style:dashed}
.ach.locked .glyph{background:var(--surface-2);color:var(--muted);opacity:.6}
.ach.locked b{color:var(--muted)}

/* forms */
.setup{max-width:760px;padding-block:24px 0}
.setup h1{font-family:var(--f-display);font-weight:500;font-size:clamp(24px,3.6vw,34px);letter-spacing:-.02em;margin-block:6px 8px}
.setup-intro p{color:var(--muted);max-width:62ch}
.form{display:grid;gap:18px;margin-top:18px;padding:20px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend,.lbl{font-weight:600;font-size:14px;padding:0;margin-bottom:8px}
label.field{display:grid;gap:6px;font-weight:600;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.row2,.row3{grid-template-columns:minmax(0,1fr)}}
input[type=number],input[type=text],input[type=url],input[type=date],select,textarea{width:100%;padding:9px 11px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:400 14.5px var(--f-body)}
textarea{resize:vertical;min-height:62px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg-o{position:relative;cursor:pointer}
.seg-o input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg-o span{display:inline-block;padding:9px 14px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.seg-o input:checked + span{background:var(--felt);color:var(--felt-ink);border-color:var(--felt)}
.seg-o input:focus-visible + span{outline:2px solid var(--brass);outline-offset:2px}
.check-row{display:flex;gap:10px;align-items:center;font-size:14px}
.check-row input{width:18px;height:18px;accent-color:var(--felt)}
.danger{margin-top:16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.danger p{max-width:52ch;font-size:13.5px;color:var(--muted)}

/* overlay */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--scrim);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{width:min(540px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:16px;padding:22px;box-shadow:var(--shadow);display:grid;gap:16px}
.dialog h2{font-family:var(--f-display);font-weight:500;font-size:20px}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

.timerbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--felt);color:var(--felt-ink);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.timer-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer-t{font-family:var(--f-mono);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.timer-l{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timerbar .btn{background:transparent;color:var(--felt-ink);border-color:currentColor}
.timerbar .btn.solid{background:var(--felt-ink);color:var(--felt);border-color:transparent}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100% - 32px);padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;box-shadow:var(--shadow)}
.toast .glyph{margin-right:6px}

footer.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;font-size:12.5px;color:var(--muted)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

const LSK='doroga2000:v1:';
const defProfile={set:false,platform:'chesscom',rating:null,goal:2000,minutes:60,start:todayYmd(),white:'italian',e4:'e5',d4:'qgd',cc:''};
const S={view:'today',viewDay:null,profile:null,progress:{days:{}},games:{list:[]},ratings:{list:[]},mode:'pending',confirmDel:null,confirmReset:false};
function lsGet(k){try{const v=localStorage.getItem(LSK+k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(LSK+k,JSON.stringify(v));}catch(e){}}
function prof(){return S.profile||defProfile;}
function sanitize(){
  if(!S.progress||typeof S.progress!=='object') S.progress={days:{}};
  if(!S.progress.days||typeof S.progress.days!=='object') S.progress.days={};
  if(!S.games||!Array.isArray(S.games.list)) S.games={list:[]};
  if(!S.ratings||!Array.isArray(S.ratings.list)) S.ratings={list:[]};
  if(S.profile&&typeof S.profile!=='object') S.profile=null;
  if(S.profile) S.profile=Object.assign({},defProfile,S.profile);
}
DOCS.forEach(n=>{const v=lsGet(n);if(v) S[n]=v;});
sanitize();

let db=null, uid=null;
const refs={}, wq={}, pendingLocal=new Set();
function hasData(n){
  if(n==='profile') return !!S.profile;
  if(n==='progress') return Object.keys(S.progress.days||{}).length>0;
  return (S[n].list||[]).length>0;
}
function persist(n){
  lsSet(n,S[n]);
  if(S.mode==='pending'){pendingLocal.add(n);return;}
  if(S.mode!=='db') return;
  const q=wq[n]||(wq[n]={retries:0});
  q.dirty=true; clearTimeout(q.timer); q.timer=setTimeout(()=>flush(n),350);
}
async function flush(n){
  const q=wq[n]; if(!q||q.inflight||!q.dirty) return;
  q.dirty=false; q.inflight=true;
  try{ await refs[n].set(clone(S[n])); q.retries=0; }
  catch(e){
    const code=e&&e.code;
    if(code==='unavailable'&&q.retries<1){q.retries++;q.dirty=true;setTimeout(()=>flush(n),1200+Math.random()*1200);}
    else if(code==='quota_exceeded'){toast('Хранилище заполнено. Удалите старые партии из журнала, чтобы сохранять новые.');}
    else if(code==='invalid_argument'||code==='not_granted'||code==='revoked'||code==='capability_disabled'){S.mode='local';renderFoot();toast('Не удалось сохранить в аккаунт — прогресс сохраняется в этом браузере.');}
    else {console.warn('save failed',e);}
  }
  finally{ q.inflight=false; if(q.dirty) flush(n); }
}
function busy(n){const q=wq[n];return !!(q&&(q.inflight||q.dirty));}
async function connect(){
  const C=window.claude;
  if(!C||typeof C.use!=='function'){S.mode='local';renderFoot();return;}
  let _db=null,_user=null,id=null;
  try{ const r=await Promise.all([C.use('db'),C.use('user')]); _db=r[0]; _user=r[1]; }catch(e){}
  try{ id=_user?await _user.id():null; }catch(e){ id=null; }
  if(!_db||!id){S.mode='local';renderFoot();return;}
  db=_db; uid=id; S.mode='db'; renderFoot();
  DOCS.forEach(n=>{
    refs[n]=db.doc('data/users/'+uid+'/'+n);
    let migrated=false;
    if(pendingLocal.has(n)){ persist(n); migrated=true; }
    refs[n].onSnapshot(snap=>{
      if(busy(n)||snap.metadata.hasPendingWrites) return;
      if(snap.exists){
        S[n]=clone(snap.data()); sanitize(); lsSet(n,S[n]);
        achQuiet=true; scheduleRender();
      } else if(!snap.metadata.fromCache && !migrated && hasData(n)){
        migrated=true; persist(n);
      }
    },err=>{console.warn('snapshot',n,err);});
  });
}
function renderFoot(){

/* ---------------- derived numbers ---------------- */
function dayRec(d){return S.progress.days[d]||null;}
function doneIdx(d){const r=dayRec(d);if(!r||!Array.isArray(r.t)) return [];const n=dayPlan(d).tasks.length;return r.t.filter(i=>i>=0&&i<n);}
function dayStatus(d){
  const r=dayRec(d), n=dayPlan(d).tasks.length, k=doneIdx(d).length;
  if(k>=n) return 'done';
  if(r&&r.m) return 'min';
  if(k>0) return 'part';
  return 'none';
}
const okDay=d=>{const s=dayStatus(d);return s==='done'||s==='min';};
function gamesSorted(){return S.games.list.slice().sort((a,b)=>a.d===b.d?(a.id<b.id?-1:1):(a.d<b.d?-1:1));}
function startRating(){
  const p=prof(); if(p.rating) return p.rating;
  const s=ratingPoints(); return s.length?s[0].v:null;
}
function ratingPoints(){
  const pts=S.ratings.list.filter(r=>r&&r.v).map(r=>({d:r.d,v:+r.v,id:r.id||''}));
  S.games.list.forEach(g=>{if(g.me) pts.push({d:g.d,v:+g.me,id:g.id});});
  return pts.sort((a,b)=>a.d===b.d?(a.id<b.id?-1:1):(a.d<b.d?-1:1));
}
function currentRating(){const s=ratingPoints();return s.length?s[s.length-1].v:(prof().rating||null);}
function scheduleAt(d){const a=prof().rating||startRating();if(a==null) return null;return Math.round(a+(prof().goal-a)*Math.max(0,Math.min(PLAN_DAYS,d))/PLAN_DAYS);}
function computeStats(){
  const today=todayIdx(), last=Math.min(PLAN_DAYS,today);
  let daysDone=0,daysMin=0,puzzles=0,xp=0;
  for(let d=1;d<=PLAN_DAYS;d++){
    const r=dayRec(d); if(!r) continue;
    const plan=dayPlan(d), idx=doneIdx(d);
    idx.forEach(i=>{const t=plan.tasks[i];xp+=t.min;if(t.n) puzzles+=t.n;});
    if(idx.length>=plan.tasks.length){daysDone++;xp+=25;}
    else if(r.m){daysMin++;puzzles+=10;xp+=15;}
  }
  let streak=0;
  if(last>=1){let d=okDay(last)?last:last-1;while(d>=1&&okDay(d)){streak++;d--;}}
  let best=0,run=0;for(let d=1;d<=last;d++){if(okDay(d)){run++;best=Math.max(best,run);}else run=0;}
  const gs=gamesSorted();
  const wins=gs.filter(g=>g.r==='W').length, draws=gs.filter(g=>g.r==='D').length, losses=gs.filter(g=>g.r==='L').length;
  const analyzed=gs.filter(g=>g.a).length;
  let nb=0,nbBest=0;gs.forEach(g=>{if(g.b===0){nb++;nbBest=Math.max(nbBest,nb);}else if(g.b) nb=0;});
  xp+=gs.length*20+analyzed*15;
  const cur=currentRating(), st=startRating();
  const stageDone=[90,180,270,360].map(d=>dayStatus(d)==='done');
  let forkWeek=true;for(let d=8;d<=14;d++) if(dayStatus(d)!=='done') forkWeek=false;
  return {today,daysDone,daysMin,puzzles,xp,streak,best,games:gs.length,wins,draws,losses,analyzed,
    noBlunder:gs.filter(g=>g.b===0).length,marked:gs.filter(g=>g.b!=null).length,nbBest,gain:(cur!=null&&st!=null)?cur-st:0,cur,start:st,stageDone,forkWeek,goal:prof().goal};
}
const RANKS=[[1,'Новичок'],[3,'III юношеский'],[6,'II юношеский'],[10,'I юношеский'],[15,'III разряд'],[21,'II разряд'],[28,'I разряд'],[36,'КМС'],[45,'Мастер плана']];

function levelOf(xp){const lv=Math.floor(xp/XP_LVL)+1;let rank=RANKS[0][1];RANKS.forEach(r=>{if(lv>=r[0]) rank=r[1];});return {lv,rank,into:xp%XP_LVL};}

      h+='<div class="wk'+(exam?' exam':'')+'"><div class="wk-l"><span class="mono">'+(exam?'Э':(w+1))+'</span><span>'+esc(label)+'</span></div><div class="sqs">';
      for(let k=0;k<7;k++){
        const off=w*7+k;
        if(off>=90){h+='<span class="sq blank'+(((w+k)%2)?' b':'')+'"></span>';continue;}
        const d=from+off, s=dayStatus(d);
        let cls=s==='done'?'done':s==='min'?'min':s==='part'?'part':(d<today?'miss':'');
        if(d===today) cls+=' today';

      }

  });

}

function niceStep(r){const c=[25,50,100,200,250,500];for(const s of c) if(r<=s) return s;return 1000;}
function chartSVG(stats){
  const p=prof(), pts=ratingPoints().map(x=>({x:Math.max(0,Math.min(PLAN_DAYS,dayIndexOf(x.d))),v:x.v}));
  const st=startRating();
  if(st==null&&!pts.length) return '<div class="empty"><b>График появится после первой записи</b>Запишите партию с рейтингом после игры или просто текущий рейтинг.</div>';
  const Wd=640,H=250,pl=46,pr=16,pt=16,pb=30;
  const vals=pts.map(x=>x.v).concat([st??pts[0].v,p.goal]);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  const step=niceStep(Math.max(1,(hi-lo)/4));
  lo=Math.floor((lo-step*.25)/step)*step; hi=Math.ceil((hi+step*.25)/step)*step;
  const X=d=>pl+d/PLAN_DAYS*(Wd-pl-pr), Y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  let s='<svg class="chart" viewBox="0 0 '+Wd+' '+H+'" role="img" aria-label="Рейтинг по дням плана и линия цели">';
  for(let v=lo;v<=hi;v+=step){s+='<line class="grid" x1="'+pl+'" x2="'+(Wd-pr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text class="ax" x="'+(pl-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+v+'</text>';}
  [90,180,270].forEach(d=>{s+='<line class="sep" x1="'+X(d).toFixed(1)+'" x2="'+X(d).toFixed(1)+'" y1="'+pt+'" y2="'+(H-pb)+'"/>';});
  ['I','II','III','IV'].forEach((r,i)=>{s+='<text class="stl" x="'+X(i*90+45).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">ЭТАП '+r+'</text>';});
  if(st!=null){
    s+='<line class="target" x1="'+X(0)+'" y1="'+Y(st).toFixed(1)+'" x2="'+X(PLAN_DAYS)+'" y2="'+Y(p.goal).toFixed(1)+'"/>';
    s+='<text class="tlbl" x="'+(X(PLAN_DAYS)-4)+'" y="'+(Y(p.goal)-8).toFixed(1)+'" text-anchor="end">цель '+p.goal+'</text>';
  }
  const tday=Math.max(0,Math.min(PLAN_DAYS,stats.today));
  s+='<line class="now" x1="'+X(tday).toFixed(1)+'" x2="'+X(tday).toFixed(1)+'" y1="'+pt+'" y2="'+(H-pb)+'"/>';
  const line=(st!=null&&p.rating?[{x:0,v:st}]:[]).concat(pts);
  if(line.length){
    const path=line.map((q,i)=>(i?'L':'M')+X(q.x).toFixed(1)+' '+Y(q.v).toFixed(1)).join(' ');
    const lastP=line[line.length-1];
    s+='<path class="area" d="'+path+' L'+X(lastP.x).toFixed(1)+' '+(H-pb)+' L'+X(line[0].x).toFixed(1)+' '+(H-pb)+' Z"/>';
    s+='<path class="line" d="'+path+'"/>';
    s+='<circle class="dot" cx="'+X(lastP.x).toFixed(1)+'" cy="'+Y(lastP.v).toFixed(1)+'" r="5"/>';
    const lx=Math.min(X(lastP.x)+8,Wd-pr-30);
    s+='<text class="lbl" x="'+lx.toFixed(1)+'" y="'+(Y(lastP.v)-9).toFixed(1)+'">'+lastP.v+'</text>';
  }
  return s+'</svg>';
}

/* ---------------- actions ---------------- */
function ensureProfile(){if(!S.profile){S.profile=clone(defProfile);persist('profile');}}
function setView(v){S.view=v;S.confirmDel=null;S.confirmReset=false;try{history.replaceState(null,'','#'+v);}catch(e){}render();window.scrollTo(0,0);}
function toggleTask(d,i){
  if(d>todayIdx()) return;
  ensureProfile();
  const days=S.progress.days, r=days[d]||(days[d]={t:[]});
  if(!Array.isArray(r.t)) r.t=[];
  const k=r.t.indexOf(i); if(k>=0) r.t.splice(k,1); else r.t.push(i);
  r.t.sort((a,b)=>a-b);
  if(!r.t.length&&!r.m&&r.v==null) delete days[d];
  persist('progress'); render();
}
function toggleMin(d){
  if(d>todayIdx()) return;
  ensureProfile();
  const days=S.progress.days, r=days[d]||(days[d]={t:[]});
  r.m=r.m?0:1;
  if(!(r.t||[]).length&&!r.m&&r.v==null) delete days[d];
  persist('progress'); render();
}
function newId(){return 'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, d=+b.dataset.d, i=+b.dataset.i;
  if(act!=='game-del'&&S.confirmDel){S.confirmDel=null;}
  if(act!=='reset'&&S.confirmReset){S.confirmReset=false;}
  switch(act){
    case 'tab': setView(b.dataset.v); break;
    case 'toggle': toggleTask(d,i); break;
    case 'min': toggleMin(d); break;
    case 'prev': S.viewDay=clampDay((S.viewDay||clampDay(todayIdx()))-1); render(); break;
    case 'next': S.viewDay=clampDay((S.viewDay||clampDay(todayIdx()))+1); render(); break;
    case 'today-day': S.viewDay=null; render(); break;
    case 'goto': S.viewDay=d; setView('today'); break;
    case 'timer': startTimer(d,i); break;
    case 'game-new': openGameForm(); break;
    case 'rating-new': openRatingForm(); break;
    case 'an-toggle': {
      const g=S.games.list.find(x=>x.id===b.dataset.id); if(!g) break;
      g.a=!g.a; persist('games'); render();
      break;}
    case 'an-open': openGameForm(b.dataset.id,true); break;
    case 'game-edit': openGameForm(b.dataset.id,false); break;
    case 'cc-sync': ccSync({manual:true}); break;
    case 'game-del': {
      const id=b.dataset.id;
      if(S.confirmDel===id){S.games.list=S.games.list.filter(x=>x.id!==id);S.confirmDel=null;persist('games');toast('Партия удалена.');}
      else S.confirmDel=id;
      render(); break;}
    case 'reset':
      if(S.confirmReset){
        ensureProfile();
        S.progress={days:{}};S.games={list:[]};S.ratings={list:[]};S.profile.start=todayYmd();S.confirmReset=false;S.viewDay=null;
        ['progress','games','ratings','profile'].forEach(persist); achSeen=null; achQuiet=true;
        planCache.clear(); toast('План начат заново. Сегодня — день 1.'); setView('today');
      } else { S.confirmReset=true; render(); }
      break;
    case 'modal-close': closeModal(); break;
    case 't-pause': timerPause(); break;
    case 't-stop': timerStop(); break;
    case 't-done': if(timer){const {d:td,i:ti}=timer;timerStop();const dn=new Set(doneIdx(td));if(!dn.has(ti)) toggleTask(td,ti);} break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.input==='value'){
    const d=+el.dataset.d; if(d>todayIdx()) return;
    ensureProfile();
    const days=S.progress.days, r=days[d]||(days[d]={t:[]});
    const v=el.value===''?null:Math.max(0,Math.min(999,Math.round(+el.value)));

document.addEventListener('submit',e=>{

function num(v,lo,hi){if(v===''||v==null) return null;const n=Math.round(+v);if(!isFinite(n)) return null;return Math.max(lo,Math.min(hi,n));}
function saveSetup(f){
  const p=clone(prof());
  p.platform=(f.querySelector('input[name=pl]:checked')||{}).value||'chesscom';
  p.puz=(f.querySelector('input[name=pz]:checked')||{}).value||'chesscom';
  p.rating=num($('#su-rating').value,100,3200);
  p.goal=num($('#su-goal').value,200,3200)||2000;
  if(p.rating&&p.goal<=p.rating) p.goal=Math.min(3200,p.rating+100);
  p.minutes=+((f.querySelector('input[name=min]:checked')||{}).value||60);
  p.white=$('#su-white').value; p.e4=$('#su-e4').value; p.d4=$('#su-d4').value;
  const sd=$('#su-start').value; if(/^\d{4}-\d{2}-\d{2}$/.test(sd)) p.start=sd;
  const prevCc=(prof().cc||'').toLowerCase(), prevStart=prof().start;
  if(CC_OK){
    const cc=($('#su-cc').value||'').trim().replace(/^@/,'');
    if(cc&&!/^[A-Za-z0-9_-]{3,25}$/.test(cc)){toast('Ник на chess.com — от 3 до 25 символов: латинские буквы, цифры, «_» и «-».');$('#su-cc').focus();return;}
    p.cc=cc;
  }
  const first=!S.profile||!S.profile.set;
  p.set=true; S.profile=p; persist('profile'); planCache.clear(); S.viewDay=null;
  setView('today');
  const t=todayIdx();
  toast(first?('План на 360 дней готов. '+(t>=1&&t<=PLAN_DAYS?'Сегодня — день '+t+'.':'')):'План обновлён.');
  if(CC_OK&&p.cc&&(p.cc.toLowerCase()!==prevCc||p.start!==prevStart||!lsGet('ccsync'))) ccSync({manual:true,full:true});
}

  openModal('<form id="gameForm" novalidate style="display:grid;gap:16px"><div><h2>'+esc(title)+'</h2>'+sub+'</div>'+

    '<div><span class="lbl" style="display:block">Результат</span>'+segM('r',[['W','Победа'],['D','Ничья'],['L','Поражение']],g?g.r:'W')+'</div>'+
    '<div><span class="lbl" style="display:block">Цвет</span>'+segM('c',[['w','Белые'],['b','Чёрные']],g?g.c:'w')+'</div>'+
    '<div class="row2"><label class="field" for="g-o">Рейтинг соперника<input id="g-o" type="number" inputmode="numeric" min="100" max="3500" value="'+(g&&g.o?esc(g.o):'')+'"></label>'+
    '<label class="field" for="g-me">Ваш рейтинг после партии<input id="g-me" type="number" inputmode="numeric" min="100" max="3500" value="'+(g&&g.me?esc(g.me):'')+'"></label></div>'+
    '<label class="field" for="g-op">Дебют<select id="g-op">'+ops.map(o=>'<option value="'+esc(o)+'"'+(o===sel?' selected':'')+'>'+esc(o||'— не указан')+'</option>').join('')+'</select></label>'+
    '<div><span class="lbl" style="display:block">Был зевок?</span>'+segM('b',[['0','Нет'],['1','Пешка'],['2','Фигура или больше']],g?(g.b==null?'':g.b):'0')+'</div>'+
    '<label class="field" for="g-e">Главная ошибка — коротко<textarea id="g-e" rows="2" maxlength="300" placeholder="Например: 18…Лd8 — не заметил вилку конём на c7">'+(g?esc(g.e):'')+'</textarea></label>'+
    '<div class="row2"><label class="field" for="g-u">Ссылка на партию<input id="g-u" type="url" placeholder="https://…" value="'+(g&&g.u?esc(g.u):'')+'"></label>'+
    '<label class="field" for="g-d">Дата<input id="g-d" type="date" value="'+(g?esc(g.d):todayYmd())+'"></label></div>'+
    '<label class="check-row" for="g-a"><input id="g-a" type="checkbox"'+((g&&g.a)||analyze?' checked':'')+'> '+(analyze?'Разобрана':'Уже разобрана')+'</label>'+
    '<div class="actions"><button type="button" class="btn" data-act="modal-close">Отмена</button><button type="submit" class="btn primary">'+(analyze?'Сохранить разбор':'Сохранить партию')+'</button></div></form>',analyze?'#g-e':null);
}
function saveGame(f){
  ensureProfile();
  const val=n=>(f.querySelector('input[name='+n+']:checked')||{}).value;
  const id=$('#g-id').value, old=id?S.games.list.find(x=>x.id===id):null;
  const d=$('#g-d').value, u=$('#g-u').value.trim(), bv=val('b');
  const fields={d:/^\d{4}-\d{2}-\d{2}$/.test(d)?d:todayYmd(),r:val('r')||'W',c:val('c')||'w',
    o:num($('#g-o').value,100,3500),me:num($('#g-me').value,100,3500),op:$('#g-op').value.slice(0,80),
    b:bv==null?null:+bv,e:$('#g-e').value.trim().slice(0,300),u:/^https?:\/\//i.test(u)?u.slice(0,300):'',a:$('#g-a').checked};
  if(old){
    const was=old.a; Object.assign(old,fields); persist('games'); closeModal(); render();
    toast(old.a&&!was?'Партия разобрана.':'Партия обновлена.');
    return;
  }
  const g=Object.assign({id:newId()},fields);
  S.games.list.push(g);
  if(S.games.list.length>600) S.games.list=gamesSorted().slice(-600);
  persist('games'); closeModal(); render();
  toast(g.a?'Партия записана.':'Партия записана с пометкой «без разбора».');
}

  openModal('<form id="ratingForm" novalidate style="display:grid;gap:16px"><h2>Записать рейтинг</h2>'+
    '<div class="row2"><label class="field" for="rf-v">Рейтинг в рапиде<input id="rf-v" type="number" inputmode="numeric" min="100" max="3500" value="'+(cur||'')+'"></label>'+
    '<label class="field" for="rf-d">Дата<input id="rf-d" type="date" value="'+todayYmd()+'"></label></div>'+
    '<p class="hint">Записывайте рейтинг раз в неделю, в день итогов. Точки появятся на графике рядом с линией цели.</p>'+
    '<div class="actions"><button type="button" class="btn" data-act="modal-close">Отмена</button><button type="submit" class="btn primary">Сохранить</button></div></form>');

function saveRating(f){
  const v=num($('#rf-v').value,100,3500); if(!v){toast('Введите рейтинг числом, например 1250.');return;}
  ensureProfile();
  const d=$('#rf-d').value;
  S.ratings.list.push({id:newId(),d:/^\d{4}-\d{2}-\d{2}$/.test(d)?d:todayYmd(),v});
  if(S.ratings.list.length>800) S.ratings.list=S.ratings.list.slice(-800);
  if(!S.profile.rating){S.profile.rating=v;persist('profile');}
  persist('ratings'); closeModal(); render(); toast('Рейтинг '+v+' записан.');
}

/* ---------------- timer ---------------- */
let timer=null, tInt=null, actx=null;
function ensureAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended') actx.resume();}catch(e){actx=null;}}
function beep(){if(!actx) return;try{[0,.28,.56].forEach(o=>{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=880;g.gain.setValueAtTime(.0001,actx.currentTime+o);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+o+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+o+.2);os.connect(g);g.connect(actx.destination);os.start(actx.currentTime+o);os.stop(actx.currentTime+o+.22);});}catch(e){}}
function startTimer(d,i){
  const t=dayPlan(d).tasks[i]; ensureAudio();
  timer={d,i,label:t.t,remain:t.min*60000,end:Date.now()+t.min*60000,running:true,over:false};
  clearInterval(tInt); tInt=setInterval(tick,500); tick();
}
function tick(){
  if(!timer){$('#timerbar').hidden=true;return;}
  if(timer.running){timer.remain=Math.max(0,timer.end-Date.now());if(timer.remain===0&&!timer.over){timer.over=true;timer.running=false;beep();}}
  const sec=Math.ceil(timer.remain/1000), mm=String(Math.floor(sec/60)).padStart(2,'0'), ss=String(sec%60).padStart(2,'0');
  const bar=$('#timerbar'); bar.hidden=false;
  bar.innerHTML='<div class="timer-in"><span class="timer-t" aria-live="off">'+(timer.over?'00:00':mm+':'+ss)+'</span><span class="timer-l">'+(timer.over?'Время вышло · ':'')+esc(timer.label)+'</span>'+
    (timer.over?'':'<button class="btn" data-act="t-pause">'+(timer.running?'Пауза':'Продолжить')+'</button>')+
    '<button class="btn solid" data-act="t-done">Готово</button><button class="btn" data-act="t-stop" aria-label="Остановить таймер">✕</button></div>';
}
function timerPause(){if(!timer) return;if(timer.running){timer.remain=Math.max(0,timer.end-Date.now());timer.running=false;}else{timer.end=Date.now()+timer.remain;timer.running=true;}tick();}
function timerStop(){timer=null;clearInterval(tInt);tInt=null;$('#timerbar').hidden=true;$('#timerbar').innerHTML='';}

/* ---------------- chess.com import ----------------
   Works only outside the Claude viewer (e.g. GitHub Pages): the viewer blocks requests to other hosts. */
const CC_OK=!(window.claude&&typeof window.claude.use==='function');
const CC_DRAW=['agreed','repetition','stalemate','insufficient','50move','timevsinsufficient'];
let ccBusy=false;
function ccOn(){return CC_OK&&!!prof().cc;}
function tcFmt(tc){const m=String(tc||'').match(/^(\d+)(?:\+(\d+))?$/);return m?Math.round(m[1]/60)+'+'+(m[2]||0):'';}
function fmtAgo(t){const m=Math.round((Date.now()-t)/60000);if(m<1) return 'только что';if(m<60) return m+' мин назад';const h=Math.round(m/60);if(h<24) return h+' ч назад';return fmtShort.format(utc(ymd(new Date(t))));}
async function ccFetch(url){
  let r;
  try{r=await fetch(url,{cache:'no-store'});}catch(e){throw {code:'net'};}
  if(r.status===404||r.status===410) throw {code:'nouser'};
  if(r.status===429) throw {code:'rate'};
  if(!r.ok) throw {code:'http'};
  return r.json();
}
function ccOpening(g){
  let u=g.eco||'';
  if(!u&&g.pgn){const m=g.pgn.match(/\[ECOUrl "([^"]+)"\]/);if(m) u=m[1];}
  const slug=(String(u).split('/openings/')[1]||'').split(/[?#]/)[0];
  const words=[];for(const w of slug.split('-')){if(!w||/^\d/.test(w)) break;words.push(w);}
  return words.join(' ').slice(0,80);
}
function ccPanel(){
  if(!CC_OK) return '';
  const p=prof();
  if(!p.cc) return '<div class="ccline"><span>Укажите ник на chess.com — рапид-партии и рейтинг будут подтягиваться сами.</span><button class="btn" data-act="tab" data-v="setup">Указать ник</button></div>';
  const st=lsGet('ccsync')||{};
  const when=st.user===p.cc.toLowerCase()&&st.at?'обновлено '+fmtAgo(st.at):'партии ещё не загружались';
  return '<div class="ccline'+(S.ccErr&&!ccBusy?' err':'')+'"><span>chess.com · <b>'+esc(p.cc)+'</b> · '+(ccBusy?'загружаю партии…':S.ccErr?esc(S.ccErr):when)+'</span>'+
    '<button class="btn" data-act="cc-sync"'+(ccBusy?' disabled':'')+'>Обновить</button></div>';
}
async function ccSync(opts){
  opts=opts||{};
  const p=prof();
  let user=(p.cc||'').toLowerCase();
  if(!CC_OK||!user||ccBusy) return;
  const st=lsGet('ccsync')||{};
  let full=!!opts.full||st.user!==user||st.start!==p.start;
  if(!opts.manual&&!full&&st.at&&Date.now()-st.at<(opts.minAge||10*60000)) return;
  ccBusy=true; scheduleRender();
  try{
    const api=u=>'https://api.chess.com/pub/player/'+encodeURIComponent(u);
    // "_" and "-" are easy to mix up in chess.com usernames: try those spellings before reporting an unknown player
    const fixes=[x=>x,x=>x.replace(/_/g,'-'),x=>x.replace(/-/g,'_'),x=>x.replace(/[_-]/g,c=>c==='_'?'-':'_')];
    let rapid=null, fixNote='';
    for(let i=0;i<fixes.length;i++){
      const cand=fixes[i](user);
      if(fixes.slice(0,i).some(f=>f(user)===cand)) continue;
      try{
        const s=await ccFetch(api(cand)+'/stats');
        rapid=s&&s.chess_rapid&&s.chess_rapid.last?s.chess_rapid.last.rating:null;
        if(cand!==user){user=cand;full=true;ensureProfile();S.profile.cc=fixes[i](p.cc);persist('profile');fixNote=' Ник исправлен на «'+S.profile.cc+'».';}
        break;
      }catch(e){if(!e||e.code!=='nouser') break;}
    }
    const base=api(user);
    const arch=(await ccFetch(base+'/games/archives')).archives||[];
    let lastEnd=full?0:(st.lastEnd||0);
    const from=new Date(Math.max(utc(p.start),lastEnd*1000)-DAY_MS);
    const fromMonth=from.getUTCFullYear()+'/'+String(from.getUTCMonth()+1).padStart(2,'0');
    const months=arch.filter(u=>{const m=String(u).match(/(\d{4})\/(\d{2})$/);return m&&(m[1]+'/'+m[2])>=fromMonth;});
    const known=new Set(S.games.list.map(g=>g.ccid).filter(Boolean));
    const added=[];let merged=0;
    for(const mu of months){
      const data=await ccFetch(mu);
      for(const g of (data.games||[])){
        if(g.time_class!=='rapid'||g.rules!=='chess'||g.rated===false||!g.end_time||!g.white||!g.black) continue;
        const d=ymd(new Date(g.end_time*1000));
        if(d<p.start) continue;
        lastEnd=Math.max(lastEnd,g.end_time);
        const ccid='cc-'+String(g.uuid||String(g.url||'').split('/').pop()||g.end_time).replace(/[^A-Za-z0-9-]/g,'');
        if(known.has(ccid)) continue;
        known.add(ccid);
        const white=String(g.white.username||'').toLowerCase()===user;
        const me=white?g.white:g.black, op=white?g.black:g.white;
        const rec={id:ccid,ccid,src:'cc',d,t:g.end_time,r:me.result==='win'?'W':CC_DRAW.indexOf(me.result)>=0?'D':'L',c:white?'w':'b',
          o:op.rating||null,me:me.rating||null,op:ccOpening(g),b:null,e:'',u:/^https:\/\/www\.chess\.com\//.test(g.url||'')?g.url:'',tc:String(g.time_control||'').slice(0,12),a:false};
        // a game the player already logged by hand on the same day: attach the chess.com data instead of duplicating it
        const twin=S.games.list.find(x=>!x.ccid&&!x.u&&x.d===rec.d&&x.r===rec.r&&x.c===rec.c);
        if(twin){Object.assign(twin,{ccid,src:'cc',t:rec.t,tc:rec.tc,u:rec.u,o:twin.o||rec.o,me:twin.me||rec.me,op:twin.op||rec.op});merged++;continue;}
        S.games.list.push(rec);added.push(rec);
      }
    }
    if(added.length||merged){if(S.games.list.length>600) S.games.list=gamesSorted().slice(-600);persist('games');}
    let ratingNote='';
    if(rapid&&!prof().rating){ensureProfile();S.profile.rating=rapid;persist('profile');ratingNote=' Стартовый рейтинг — '+rapid+'.';}
    lsSet('ccsync',{user,start:p.start,at:Date.now(),lastEnd});
    S.ccErr=null;
    if(added.length){
      const w=added.filter(x=>x.r==='W').length, dr=added.filter(x=>x.r==='D').length, l=added.length-w-dr;
      S.syncMsg='С chess.com: '+added.length+' '+plural(added.length,'партия','партии','партий')+' (+'+w+' ='+dr+' −'+l+'). '+plural(added.length,'Ждёт','Ждут','Ждут')+' разбора.'+ratingNote+fixNote;
    } else if(opts.manual||ratingNote||fixNote){
      S.syncMsg='Новых рапид-партий с '+fmtShort.format(utc(p.start))+' нет.'+ratingNote+fixNote;
    }
  }catch(e){
    const code=e&&e.code;
    S.ccErr=code==='nouser'?'игрок не найден':code==='rate'?'chess.com просит подождать минуту':'нет связи с chess.com';
    if(opts.manual||code==='nouser') S.syncMsg=code==='nouser'?'Игрок «'+p.cc+'» не найден на chess.com. Проверьте ник в настройке: он должен совпадать с именем в профиле.':code==='rate'?'chess.com просит подождать. Попробуйте через минуту.':'Не удалось связаться с chess.com. Проверьте интернет и попробуйте ещё раз.';
  }finally{
    ccBusy=false; scheduleRender();
    if(S.syncMsg){toast(S.syncMsg);S.syncMsg=null;}
  }
}

/* ---------------- toast ---------------- */
let toastT=null;
function toast(msg,html){const t=$('#toast');if(html) t.innerHTML=msg; else t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},5000);}

/* ---------------- boot ---------------- */
const h0=(location.hash||'').slice(1); if(VIEWS.indexOf(h0)>=0) S.view=h0;
let lastDay=todayYmd();
render();
connect();
if(CC_OK){
  ccSync();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible') ccSync({minAge:5*60000});});
}
setInterval(()=>{const k=todayYmd();if(k!==lastDay){lastDay=k;if(!isEditing()) render();}},60000);
})();
